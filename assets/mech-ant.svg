<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" fill="none" role="img" aria-labelledby="mechTitle mechDesc">
  <title id="mechTitle">蚍蜉战队机械蚁概念单位</title>
  <desc id="mechDesc">一台以机械蚁为灵感的蓝黑色战斗机器人半身概念图，带有发光复眼、装甲与电路细节。</desc>

  <defs>
    <linearGradient id="armorDark" x1="450" y1="180" x2="450" y2="790" gradientUnits="userSpaceOnUse">
      <stop stop-color="#293D59"/>
      <stop offset=".32" stop-color="#142239"/>
      <stop offset=".7" stop-color="#0A1220"/>
      <stop offset="1" stop-color="#060A12"/>
    </linearGradient>
    <linearGradient id="armorMid" x1="300" y1="250" x2="620" y2="690" gradientUnits="userSpaceOnUse">
      <stop stop-color="#36506F"/>
      <stop offset=".38" stop-color="#1A2B43"/>
      <stop offset=".75" stop-color="#0C1626"/>
      <stop offset="1" stop-color="#080D17"/>
    </linearGradient>
    <linearGradient id="armorLight" x1="380" y1="200" x2="520" y2="480" gradientUnits="userSpaceOnUse">
      <stop stop-color="#708BAA"/>
      <stop offset=".32" stop-color="#354D6A"/>
      <stop offset=".8" stop-color="#17253A"/>
      <stop offset="1" stop-color="#0B1220"/>
    </linearGradient>
    <linearGradient id="chrome" x1="330" y1="260" x2="580" y2="540" gradientUnits="userSpaceOnUse">
