    <linearGradient id="jetBlack" x1="450" y1="300" x2="450" y2="780" gradientUnits="userSpaceOnUse">
      <stop stop-color="#101A2A"/>
      <stop offset=".55" stop-color="#070C14"/>
      <stop offset="1" stop-color="#03060B"/>
    </linearGradient>
    <linearGradient id="visor" x1="348" y1="294" x2="552" y2="338" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B3CA5"/>
      <stop offset=".2" stop-color="#1D72FF"/>
      <stop offset=".5" stop-color="#87ECFF"/>
      <stop offset=".72" stop-color="#248BFF"/>
      <stop offset="1" stop-color="#0E3C9D"/>
    </linearGradient>
    <linearGradient id="core" x1="408" y1="500" x2="492" y2="600" gradientUnits="userSpaceOnUse">
      <stop stop-color="#D5FAFF"/>
      <stop offset=".25" stop-color="#5FE2FF"/>
      <stop offset=".62" stop-color="#1679FF"/>
      <stop offset="1" stop-color="#0B3AA5"/>
    </linearGradient>
    <linearGradient id="antenna" x1="150" y1="130" x2="390" y2="280" gradientUnits="userSpaceOnUse">
      <stop stop-color="#C8DDF5"/>
      <stop offset=".38" stop-color="#597594"/>
      <stop offset=".7" stop-color="#1B2E47"/>
      <stop offset="1" stop-color="#90A9C4"/>
    </linearGradient>
    <linearGradient id="fadeArm" x1="450" y1="600" x2="450" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0E1929"/>
      <stop offset=".65" stop-color="#060B14"/>
      <stop offset="1" stop-color="#060B14" stop-opacity=".1"/>
    </linearGradient>
    <radialGradient id="aura" cx="0" cy="0" r="1" gradientTransform="translate(450 500) rotate(90) scale(360 420)">
      <stop stop-color="#1E7BFF" stop-opacity=".28"/>
      <stop offset=".44" stop-color="#125DCE" stop-opacity=".08"/>
      <stop offset="1" stop-color="#071021" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="coreHalo" cx="0" cy="0" r="1" gradientTransform="translate(450 555) rotate(90) scale(126)">
      <stop stop-color="#3FDEFF" stop-opacity=".68"/>
      <stop offset=".48" stop-color="#1579FF" stop-opacity=".18"/>
      <stop offset="1" stop-color="#1579FF" stop-opacity="0"/>
    </radialGradient>

    <filter id="glowBlue" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.08  0 0 0 0 0.55  0 0 0 0 1  0 0 0 .9 0"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowSoft" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="13" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="dropShadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="24" stdDeviation="20" flood-color="#00030A" flood-opacity=".75"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="2" seed="8" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope=".05"/>
      </feComponentTransfer>
    </filter>
  </defs>

